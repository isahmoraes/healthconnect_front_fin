<div class="dashboard-container">

    <div class="page-header">

        <h1>Painel Principal</h1>

        <p>
            Visão geral do sistema de agendamentos e estatísticas.
        </p>

    </div>

    <div class="stats-grid">

        <app-stat-card-data
            title="Total de Agendamentos"
            [value]="totalAppointments()"
            description="Cadastrados no sistema"
            iconClass="lucide-calendar">
        </app-stat-card-data>

        <app-stat-card-data
            title="Confirmados"
            [value]="totalConfirmed()"
            description="Consultas confirmadas"
            iconClass="lucide-check-circle">
        </app-stat-card-data>

        <app-stat-card-data
            title="Pendentes"
            [value]="totalPending()"
            description="Aguardando aprovação/confirmação"
            iconClass="lucide-clock">
        </app-stat-card-data>

        <app-stat-card-data
            title="Cancelados"
            [value]="totalCancelled()"
            description="Consultas canceladas"
            iconClass="lucide-x-circle">
        </app-stat-card-data>

    </div>

    <div class="table-container">

        <h2>Próximas Consultas</h2>

        <table>

            <thead>

                <tr>
                    <th>Paciente</th>
                    <th>Médico</th>
                    <th>Data/Hora</th>
                    <th>Status</th>
                </tr>

            </thead>

            <tbody>

                <tr
                    *ngFor="let item of recentAppointments()">

                    <td>{{ item.patient?.name || 'N/A' }}</td>

                    <td>{{ item.doctor?.name || 'N/A' }}</td>

                    <td>{{ item.dateTime | date:'dd/MM/yyyy HH:mm' }}</td>

                    <td>

                        <span
                            class="status-badge"
                            [ngClass]="getStatusClass(item.status)">

                            {{ item.status }}

                        </span>

                    </td>

                </tr>

                <tr *ngIf="appointmentService.appointments().length === 0">

                    <td
                        colspan="4"
                        class="empty-message">

                        Nenhum agendamento recente para exibir.

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>
