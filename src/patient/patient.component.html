
<div class="patients-container">

    <div class="page-header">

        <div>

            <h1>Pacientes</h1>

            <p>
                Cadastre e gerencie os pacientes da clínica.
            </p>

        </div>

        <button
            class="primary-button"
            (click)="toggleForm()">

            {{ showForm() ? 'Fechar formulário' : '+ Novo paciente' }}

        </button>

    </div>

    <div
        class="form-card"
        *ngIf="showForm()">

        <h2>{{ editingPatientId === null ? 'Cadastrar paciente' : 'Editar paciente' }}</h2>

        <form (ngSubmit)="savePatient()">

            <div class="form-grid">

                <div class="form-group">

                    <label>Nome completo</label>

                    <input
                        type="text"
                        [(ngModel)]="newPatient.name"
                        name="name"
                        required>

                </div>

                <div class="form-group">

                    <label>CPF</label>

                    <input
                        type="text"
                        [(ngModel)]="newPatient.cpf"
                        name="cpf"
                        required>

                </div>

                <div class="form-group">

                    <label>Telefone</label>

                    <input
                        type="text"
                        [(ngModel)]="newPatient.phone"
                        name="phone"
                        required>

                </div>

                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        [(ngModel)]="newPatient.email"
                        name="email">

                </div>

            </div>

            <div class="form-actions">

                <button
                    type="button"
                    class="secondary-button"
                    (click)="toggleForm()">

                    Cancelar

                </button>

                <button
                    type="submit"
                    class="primary-button">

                    {{ editingPatientId === null ? 'Salvar paciente' : 'Atualizar paciente' }}

                </button>

            </div>

        </form>

    </div>

    <div class="table-card">

        <table>

            <thead>

                <tr>

                    <th>Nome</th>

                    <th>CPF</th>

                    <th>Telefone</th>

                    <th>Email</th>

                    <th class="actions-column">
                        Ações
                    </th>

                </tr>

            </thead>

            <tbody>

                <tr
                    *ngFor="let patient of patientService.patients()">

                    <td>{{ patient.name }}</td>

                    <td>{{ patient.cpf }}</td>

                    <td>{{ patient.phone }}</td>

                    <td>{{ patient.email || 'Não informado' }}</td>

                    <td>
                        <button
                            class="edit-button"
                            (click)="editPatient(patient)">

                            Editar

                        </button>

                       
                    </td>

                </tr>

                <tr *ngIf="patientService.patients().length === 0">

                    <td
                        colspan="5"
                        class="empty-message">

                        Nenhum paciente encontrado.

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>
