<div class="specialties-container">

    <div class="page-header">

        <div>

            <h1>Medical Specialties</h1>

            <p>
                Medical specialties available in the appointment system.
            </p>

        </div>

        <button
            class="primary-button"
            (click)="toggleForm()">

            {{ showForm() ? 'Close Form' : '+ New Specialty' }}

        </button>

    </div>

    <div
        class="form-card"
        *ngIf="showForm()">

        <h2>Register Specialty</h2>

        <form (ngSubmit)="saveSpecialty()">

            <div class="form-group">

                <label>Specialty Name</label>

                <input
                    type="text"
                    [(ngModel)]="newSpecialty.name"
                    name="name"
                    placeholder="Cardiology, Pediatrics..."
                    required>

            </div>

            <div class="form-group">

                <label>Description</label>

                <textarea
                    rows="4"
                    [(ngModel)]="newSpecialty.description"
                    name="description"
                    placeholder="Brief description of the specialty">

                </textarea>

            </div>

            <div class="form-actions">

                <button
                    type="button"
                    class="secondary-button"
                    (click)="toggleForm()">

                    Cancel

                </button>

                <button
                    type="submit"
                    class="primary-button">

                    Save Specialty

                </button>

            </div>

        </form>

    </div>

    <div class="specialties-grid">

        <div
            class="specialty-card"
            *ngFor="let specialty of specialtyService.specialties()">

            <div class="card-header">

                <h3>{{ specialty.name }}</h3>

                <button
                    class="delete-button"
                    (click)="removeSpecialty(specialty.id)">

                    Delete

                </button>

            </div>

            <p>

                {{ specialty.description || 'No description available.' }}

            </p>

        </div>

        <div
            class="empty-card"
            *ngIf="specialtyService.specialties().length === 0">

            No specialties found.

        </div>

    </div>

</div>
