<div class="specialties-container">

    <div class="page-header">

        <div>

            <h1>Especialidades médicas</h1>

            <p>
                Especialidades médicas disponíveis no sistema de agendamentos.
            </p>

        </div>

        <button
            class="primary-button"
            (click)="toggleForm()">

            {{ showForm() ? 'Fechar formulário' : '+ Nova especialidade' }}

        </button>

    </div>

    <div
        class="form-card"
        *ngIf="showForm()">

        <h2>Cadastrar especialidade</h2>

        <form (ngSubmit)="saveSpecialty()">

            <div class="form-group">

                <label>Nome da especialidade</label>

                <input
                    type="text"
                    [(ngModel)]="newSpecialty.name"
                    name="name"
                    placeholder="Cardiologia, Pediatria..."
                    required>

            </div>

            <div class="form-group">

                <label>Descrição</label>

                <textarea
                    rows="4"
                    [(ngModel)]="newSpecialty.description"
                    name="description"
                    placeholder="Breve descrição da especialidade">

                </textarea>

            </div>

            <div class="form-actions">

                <button
                    type="button"
                    class="secondary-button"
                    (click)="toggleForm()">

                    Cancelar

                </button>

                <button
                    type="submit"
                    class="primary-button">

                    Salvar especialidade

                </button>

            </div>

        </form>

    </div>

    <div class="specialties-grid">

        <div
            class="specialty-card"
            *ngFor="let specialty of specialtyService.specialties()">

            <div class="card-header">

                <h3>{{ specialty.name }}</h3>

                <button
                    class="edit-button"
                    (click)="editSpecialty(specialty)">

                    Editar

                </button>

                <button
                    class="delete-button"
                    (click)="removeSpecialty(specialty.id)">

                    Excluir

                </button>

            </div>

            <p>

                {{ specialty.description || 'Nenhuma descrição disponível.' }}

            </p>

        </div>

        <div
            class="empty-card"
            *ngIf="specialtyService.specialties().length === 0">

            Nenhuma especialidade encontrada.

        </div>

    </div>

</div>
