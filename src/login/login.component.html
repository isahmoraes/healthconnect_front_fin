<div class="login-page">
  <div class="login-card">
    <div class="login-illustration">
      <div class="brand-mark">
        <img src="/logo.png" alt="HealthConnect" />
      </div>

      <div class="welcome-copy">
        <span class="eyebrow">Bem-vindo(a)</span>
        <h1>HealthConnect</h1>
        <p>
          Gerencie consultas, pacientes e profissionais com uma experiência
          moderna e organizada.
        </p>
      </div>

      <ul class="feature-list">
        <li>Agenda centralizada</li>
        <li>Controle de agendamentos</li>
        <li>Equipe mais produtiva</li>
      </ul>
    </div>

    <div class="login-form-panel">
      <div class="form-header">
        <span class="mini-badge">Acesso ao sistema</span>
        <h2>Entrar</h2>
      </div>

      <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <label class="field">
          <span>E-mail</span>
          <input
            type="email"
            formControlName="email"
            placeholder="seuemail@empresa.com"
            [class.input-error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          />
        </label>

        <label class="field">
          <span>Senha</span>
          <input
            type="password"
            formControlName="password"
            placeholder="Digite sua senha"
            [class.input-error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          />
        </label>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" name="remember" />
            <span>Lembrar-me</span>
          </label>

          <a href="#">Esqueci a senha</a>
        </div>

        @if (errorMessage) {
          <div class="error-message">{{ errorMessage }}</div>
        }

        <button type="submit" class="login-button">
          Entrar
        </button>
      </form>
    </div>
  </div>
</div>
